use_default_settings: true

general:
  debug: false
  instance_name: "LLM Chat Search"

search:
  safe_search: 0
  autocomplete: ""
  default_lang: "zh-CN"
  formats:
    - html
    - json

server:
  secret_key: "changeme_searxng_secret_key_12345678"
  limiter: false
  image_proxy: false
  method: "GET"

ui:
  static_use_hash: true
  default_locale: "zh-CN"
  query_in_title: false
  infinite_scroll: false
  center_alignment: false
  default_theme: simple
  theme_args:
    simple_style: auto

outgoing:
  request_timeout: 10.0
  max_request_timeout: 15.0

engines:
  - name: google
    engine: google
    shortcut: go
    disabled: false

  - name: bing
    engine: bing
    shortcut: bi
    disabled: false

  - name: duckduckgo
    engine: duckduckgo
    shortcut: ddg
    disabled: false

  - name: wikipedia
    engine: wikipedia
    shortcut: wp
    disabled: false

  - name: reddit
    engine: reddit
    shortcut: re
    disabled: true

  - name: github
    engine: github
    shortcut: gh
    disabled: true
