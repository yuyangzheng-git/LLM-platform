version: '3.8'

services:
  # PostgreSQL 数据库
  postgres:
    image: postgres:15-alpine
    container_name: llm-chat-db
    environment:
      POSTGRES_DB: llmchat
      POSTGRES_USER: llmuser
      POSTGRES_PASSWORD: ${DB_PASSWORD:-llmchat2024}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: always
    networks:
      - llm-chat-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U llmuser"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 后端服务
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: llm-chat-backend
    volumes:
      - ./backend/data:/app/data
      - ./backend/uploads:/app/uploads
      - ./backend/logs:/app/logs
    environment:
      - HOST=0.0.0.0
      - PORT=3211
      - DATABASE_URL=postgresql+asyncpg://llmuser:${DB_PASSWORD:-llmchat2024}@postgres:5432/llmchat
      - DEBUG=False
      - ALLOWED_ORIGINS=http://your-server-ip:3212
    env_file:
      - ./backend/.env
    restart: always
    networks:
      - llm-chat-network
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3211/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # 前端服务
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # 使用空字符串，因为前端和 API 通过同一个 Nginx（3212 端口）
        - VITE_API_BASE_URL=
    container_name: llm-chat-frontend
    restart: always
    networks:
      - llm-chat-network
    depends_on:
      - backend

  # Nginx 反向代理 - 监听 3212 端口
  nginx:
    image: nginx:alpine
    container_name: llm-chat-nginx
    ports:
      - "3212:3212"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./frontend/dist:/usr/share/nginx/html:ro
    depends_on:
      - backend
      - frontend
    restart: always
    networks:
      - llm-chat-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3212/health"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  llm-chat-network:
    driver: bridge

volumes:
  postgres-data:
  backend-data:
  backend-uploads:
  backend-logs:
